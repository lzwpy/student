<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>卡通风格样式板</title>
  <style>
    :root {
      --bg: #fffaf5;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #1ec8b5;
      --primary-soft: #dffaf4;
      --gold: #f6c453;
      --gold-soft: #fff7dd;
      --danger: #ff8fa3;
      --danger-soft: #fff1f3;
      --line: #f1e7dd;
      --shadow: 0 14px 28px rgba(252, 199, 159, 0.15);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 36px;
      background: linear-gradient(180deg, #fffaf5 0%, #fff5ee 100%);
      font-family: "Microsoft YaHei", sans-serif;
      color: var(--text);
    }
    .frame {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px;
      border: 1px solid var(--line);
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(6px);
      box-shadow: var(--shadow);
    }
    .grid { display: grid; gap: 18px; }
    .palette { grid-template-columns: repeat(5, 1fr); }
    .swatch {
      padding: 18px;
      border-radius: 24px;
      min-height: 120px;
      border: 1px solid rgba(255,255,255,.45);
      display: flex;
      align-items: end;
      font-weight: 700;
    }
    .section { margin-top: 28px; }
    .chips, .buttons { display: flex; gap: 16px; flex-wrap: wrap; }
    .chip, .btn {
      border-radius: 999px;
      padding: 10px 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
    }
    .btn {
      min-height: 56px;
      border-radius: 20px;
      padding: 0 24px;
      border: 1px solid var(--line);
      box-shadow: 0 10px 18px rgba(31, 41, 55, 0.06);
    }
    .card-demo {
      margin-top: 20px;
      width: 360px;
      padding: 22px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
    }
    .avatar {
      width: 92px;
      height: 92px;
      border-radius: 28px;
      background: radial-gradient(circle at 30% 30%, #ffe3c8 0%, #f9d4bd 55%, #f3c6a8 100%);
    }
    .bar {
      height: 14px;
      border-radius: 999px;
      background: #ecfeff;
      overflow: hidden;
    }
    .bar > span {
      display: block;
      width: 54%;
      height: 100%;
      background: linear-gradient(90deg, #34d8c6 0%, #1ec8b5 100%);
    }
  </style>
</head>
<body>
  <div class="frame">
    <h1>卡通风格样式板</h1>
    <p>这个文件用于确定主色、按钮、芯片、卡片和柔和投影的统一视觉语言。</p>

    <div class="section grid palette">
      <div class="swatch" style="background:#1ec8b5;color:#fff;">主色</div>
      <div class="swatch" style="background:#f6c453;">金币色</div>
      <div class="swatch" style="background:#ff8fa3;">撤回色</div>
      <div class="swatch" style="background:#dffaf4;">正向背景</div>
      <div class="swatch" style="background:#ffe8ed;">负向背景</div>
    </div>

    <div class="section">
      <h2>按钮与芯片</h2>
      <div class="buttons">
        <button class="btn" style="background:#1ec8b5;color:#fff;">确认购买</button>
        <button class="btn" style="background:#fff;color:#374151;">取消</button>
        <button class="btn" style="background:#fff1f3;color:#e11d48;border-color:#fecdd3;">撤回</button>
      </div>
      <div class="chips" style="margin-top:16px;">
        <span class="chip" style="background:#dffaf4;color:#0f766e;">EXP +1</span>
        <span class="chip" style="background:#fff7dd;color:#a16207;">+1 金币</span>
        <span class="chip" style="background:#ecfeff;color:#0f766e;">Lv.1</span>
      </div>
    </div>

    <div class="section">
      <h2>卡片示意</h2>
      <div class="card-demo">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span class="chip" style="background:#dffaf4;color:#0f766e;">Lv.1</span>
          <span class="chip" style="background:#fff7dd;color:#a16207;">2 金币</span>
        </div>
        <div style="display:flex;justify-content:center;margin:18px 0;">
          <div class="avatar"></div>
        </div>
        <div style="font-size:14px;color:#6b7280;">李昱成</div>
        <div style="font-size:28px;font-weight:700;margin-top:4px;">我的刀盾</div>
        <div class="bar" style="margin-top:18px;"><span></span></div>
        <p style="margin:12px 0 0;color:#6b7280;">用于宠物卡、小卖部卡片和最近操作面板的统一视觉。</p>
      </div>
    </div>
  </div>
</body>
</html>
