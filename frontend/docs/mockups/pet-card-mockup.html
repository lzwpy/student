<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>宠物卡片样式稿</title>
  <style>
    body { margin:0; padding:40px; background:#fff8f3; font-family:"Microsoft YaHei",sans-serif; }
    .wrap { display:flex; gap:24px; }
    .card {
      width:280px;
      padding:18px;
      border-radius:28px;
      background:#fff;
      border:1px solid #f1e7dd;
      box-shadow:0 14px 28px rgba(252,199,159,.14);
    }
    .top { display:flex; justify-content:space-between; }
    .chip { padding:8px 12px; border-radius:999px; font-weight:700; font-size:14px; }
    .avatar {
      width:132px;
      height:132px;
      margin:18px auto;
      border-radius:34px;
      background:radial-gradient(circle at 30% 30%, #ffe6cf, #ffd2b0 60%, #f4c3a0 100%);
      box-shadow: inset 0 4px 14px rgba(255,255,255,.8);
    }
    .bar { height:14px; border-radius:999px; background:#ecfeff; overflow:hidden; }
    .bar > span { display:block; width:58%; height:100%; background:linear-gradient(90deg,#43e0ce,#1ec8b5); }
    .label { color:#6b7280; font-size:14px; }
    .name { font-size:30px; font-weight:800; color:#111827; margin-top:4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="top">
        <span class="chip" style="background:#dffaf4;color:#0f766e;">Lv.1</span>
        <span class="chip" style="background:#fff7dd;color:#a16207;">2 金币</span>
      </div>
      <div class="avatar"></div>
      <div class="label">李昱成</div>
      <div class="name">我的刀盾</div>
      <div class="label" style="margin-top:12px;">距 Lv.2 还差 8</div>
      <div class="bar" style="margin-top:10px;"><span></span></div>
    </div>
    <div class="card">
      <div class="top">
        <span class="chip" style="background:#dffaf4;color:#0f766e;">Lv.1</span>
        <span class="chip" style="background:#fff7dd;color:#a16207;">0 金币</span>
      </div>
      <div class="avatar" style="background:radial-gradient(circle at 30% 30%, #fff2d9, #ffd88f 58%, #ffc35a 100%);"></div>
      <div class="label">王钿源</div>
      <div class="name">波宝</div>
      <div class="label" style="margin-top:12px;">距 Lv.2 还差 10</div>
      <div class="bar" style="margin-top:10px;"><span style="width:36%;"></span></div>
    </div>
  </div>
</body>
</html>
