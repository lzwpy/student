<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>主框架样式稿</title>
  <style>
    body { margin:0; padding:24px; background:#fff8f3; font-family:"Microsoft YaHei",sans-serif; color:#1f2937; }
    .app { max-width:1280px; margin:0 auto; }
    .topbar {
      background:#fff;
      border:1px solid #f1e7dd;
      border-radius:30px;
      padding:18px 22px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      box-shadow:0 14px 28px rgba(252,199,159,.15);
    }
    .brand { display:flex; align-items:center; gap:16px; font-weight:800; font-size:28px; }
    .logo { width:56px; height:56px; border-radius:18px; background:linear-gradient(135deg,#ffe6cf,#ffd7bc); }
    .nav { display:flex; gap:12px; }
    .nav span {
      padding:12px 18px;
      border-radius:999px;
      background:#fff;
      border:1px solid #f1e7dd;
      color:#4b5563;
    }
    .nav .active {
      background:#1f2937;
      color:#fff;
      border-color:#1f2937;
    }
    .hero {
      margin-top:24px;
      display:grid;
      grid-template-columns:1.6fr 1fr;
      gap:20px;
    }
    .panel {
      background:#fff;
      border:1px solid #f1e7dd;
      border-radius:30px;
      padding:24px;
      box-shadow:0 14px 28px rgba(252,199,159,.12);
    }
    .cards { margin-top:24px; display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
    .card { min-height:240px; border-radius:28px; background:#fff; border:1px solid #f1e7dd; box-shadow:0 10px 18px rgba(31,41,55,.06); }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <span>积分养宠物</span>
      </div>
      <div class="nav">
        <span>宠物乐园</span>
        <span class="active">小卖部</span>
        <span>光荣榜</span>
        <span>百宝箱</span>
        <span>系统设置</span>
      </div>
    </div>

    <div class="hero">
      <div class="panel">
        <h1>欢迎来到课堂小卖部</h1>
        <p>主框架采用更像游戏大厅的卡片式布局，导航做成胶囊标签，整体更接近你给的参考图。</p>
      </div>
      <div class="panel">
        <h2>四（4）班</h2>
        <p>班级切换器也会统一改成圆角、浅描边、无后台感的视觉。</p>
      </div>
    </div>

    <div class="cards">
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
    </div>
  </div>
</body>
</html>
