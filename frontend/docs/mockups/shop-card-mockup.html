<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>小卖部卡片样式稿</title>
  <style>
    body { margin:0; padding:40px; background:#fff8f3; font-family:"Microsoft YaHei",sans-serif; color:#1f2937; }
    .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:22px; }
    .card {
      background:#fff;
      border:1px solid #f1e7dd;
      border-radius:28px;
      box-shadow:0 14px 28px rgba(252,199,159,.14);
      padding:18px;
    }
    .art {
      height:156px;
      border-radius:24px;
      background:linear-gradient(180deg,#fff6d5,#ffe1aa);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#a16207;
      font-weight:800;
      font-size:32px;
    }
    .chip { padding:8px 12px; border-radius:999px; font-weight:700; display:inline-block; }
    .actions { display:flex; gap:12px; margin-top:16px; }
    .btn { flex:1; min-height:48px; border-radius:18px; border:1px solid #f1e7dd; font-weight:700; }
  </style>
</head>
<body>
  <div class="grid">
    <div class="card">
      <div class="art">贴纸</div>
      <div style="margin-top:16px;font-size:26px;font-weight:800;">星星奖励贴纸</div>
      <div style="color:#6b7280;margin-top:8px;">商品卡片预留插画区，避免只有纯文字。</div>
      <div style="margin-top:14px;display:flex;gap:10px;">
        <span class="chip" style="background:#fff7dd;color:#a16207;">5 金币</span>
        <span class="chip" style="background:#f3f4f6;color:#4b5563;">库存 18</span>
      </div>
      <div class="actions">
        <button class="btn" style="background:#1ec8b5;color:#fff;">购买</button>
        <button class="btn" style="background:#fff;">编辑</button>
      </div>
    </div>
    <div class="card">
      <div class="art" style="background:linear-gradient(180deg,#ffe6ef,#ffcddd);color:#be123c;">徽章</div>
      <div style="margin-top:16px;font-size:26px;font-weight:800;">课堂奖励徽章</div>
      <div style="color:#6b7280;margin-top:8px;">购买按钮最突出，管理按钮次级化。</div>
      <div style="margin-top:14px;display:flex;gap:10px;">
        <span class="chip" style="background:#fff7dd;color:#a16207;">8 金币</span>
        <span class="chip" style="background:#f3f4f6;color:#4b5563;">库存 无限</span>
      </div>
      <div class="actions">
        <button class="btn" style="background:#1ec8b5;color:#fff;">购买</button>
        <button class="btn" style="background:#fff1f3;color:#e11d48;border-color:#fecdd3;">下架</button>
      </div>
    </div>
  </div>
</body>
</html>
